<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Forecast</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="home">

  <video id="bg-video" autoplay muted loop playsinline></video>
  <div id="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div id="drops"></div>
  </div>

  <main>
    <header>
      <p class="emojis">☀️ ⛅ 🌧️ ❄️</p>
      <h1>Weather Forecast</h1>
      <p class="tagline">Check the weather in any city</p>
    </header>

    <form id="search-form" autocomplete="off">
      <label for="city" class="sr-only">City name</label>
      <input id="city" type="text" placeholder="Type a city, e.g. London" required />
      <button type="submit" id="search-btn">Search</button>
    </form>

    <p id="status" role="status" aria-live="polite">Enter a city name to see its current weather.</p>

    <section id="result" hidden>
      <h2 id="place"></h2>
      <p id="local-time"></p>

      <div class="now">
        <span id="temp"></span>
        <div class="condition">
          <img id="icon" alt="" width="64" height="64" />
          <span id="condition-text"></span>
        </div>
      </div>

      <dl>
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Air quality</dt><dd id="air"></dd></div>
      </dl>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
